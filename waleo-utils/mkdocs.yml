site_name: Waleo Utils 文档
site_description: Waleo 机器人学习框架的基础设施工具模块
site_author: Waleo Team

# Repository
repo_url: https://github.com/waleo-robotics/waleo-utils
repo_name: waleo-utils

# Copyright
copyright: Copyright &copy; 2024 Waleo Team

theme:
  name: material
  language: zh
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

# Plugins
plugins:
  - search:
      lang:
        - zh
        - en

# Extensions
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

# Navigation
nav:
  - 首页: index.md
  - 快速开始:
    - 安装: installation.md
    - 快速入门: quickstart.md
  - 模块文档:
    - 设备管理: modules/device.md
    - 随机数管理: modules/random.md
    - 时间测量: modules/timing.md
    - 日志模块: modules/logging.md
    - I/O 操作: modules/io.md
    - 分布式训练: modules/distributed.md
    - RPC 通信: modules/communication.md
  - API 参考:
    - 设备 API: api/device.md
    - 随机数 API: api/random.md
    - 时间测量 API: api/timing.md
    - 日志 API: api/logging.md
    - I/O API: api/io.md
    - 分布式 API: api/distributed.md
    - 通信 API: api/communication.md
