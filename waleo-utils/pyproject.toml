[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "waleo-utils"
version = "0.1.0"
description = "Waleo Infrastructure Utilities - Device management, distributed training, communication, logging, and more"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Apache-2.0"}
authors = [
    {name = "Waleo Team"}
]
keywords = ["robotics", "machine learning", "infrastructure", "distributed training"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=1.12.0",
    "numpy>=1.20.0",
    "tensorboard>=2.10.0",
    "pillow>=9.0.0",
]

[project.optional-dependencies]
# 可选依赖
video = [
    "imageio>=2.20.0",
    "imageio-ffmpeg>=0.4.7",
]
opencv = [
    "opencv-python>=4.5.0",
]
json = [
    "orjson>=3.8.0",
]
all = [
    "waleo-utils[video,opencv,json]",
]

# 开发依赖
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "isort>=5.10.0",
    "flake8>=5.0.0",
    "mypy>=0.990",
    "waleo-utils[all],
]

[project.urls]
Homepage = "https://github.com/waleo-robotics/waleo-utils"
Documentation = "https://github.com/waleo-robotics/waleo-utils/docs"
Repository = "https://github.com/waleo-robotics/waleo-utils"
Issues = "https://github.com/waleo-robotics/waleo-utils/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["waleo_utils*"]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
