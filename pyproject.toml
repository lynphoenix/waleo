[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "waleo"
version = "0.1.0"
description = "Waleo - Complete Robotics Learning Framework with simulation, training utilities, and configuration management"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [
    {name = "Waleo Team"}
]
keywords = [
    "robotics",
    "machine learning",
    "reinforcement learning",
    "simulation",
    "distributed training",
    "maniskill"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Robotics",
]

# 核心依赖
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "tensorboard>=2.10.0",
    "pillow>=9.0.0",
]

[project.optional-dependencies]
# 仿真后端
mujoco = ["mujoco>=3.0.0"]
pybullet = ["pybullet>=3.2.0"]
maniskill = ["mani-skill>=3.0.0"]
isaacgym = ["isaacgym"]

# 工具增强
video = [
    "imageio>=2.20.0",
    "imageio-ffmpeg>=0.4.7",
]
opencv = ["opencv-python>=4.5.0"]
json = ["orjson>=3.8.0"]

# 组合安装
sim = ["waleo[mujoco,pybullet,maniskill]"]
utils_full = ["waleo[video,opencv,json]"]
all = ["waleo[sim,utils_full]"]

# 开发依赖
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "isort>=5.10.0",
    "flake8>=5.0.0",
    "mypy>=0.990",
]

[project.urls]
Homepage = "https://github.com/lynphoenix/waleo"
Documentation = "https://github.com/lynphoenix/waleo/tree/main/docs"
Repository = "https://github.com/lynphoenix/waleo"
Issues = "https://github.com/lynphoenix/waleo/issues"

# 使用 src-layout
[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]

[tool.setuptools.package-dir]
"" = "src"

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
src_paths = ["src", "tests"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=src --cov-report=term-missing"
